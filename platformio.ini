; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed= 115200

platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.4
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.4/esp32-arduino-libs-3.0.4.zip

lib_deps = 

   https://github.com/STMicroelectronics/lsm6dsv80x-pid.git#v3.0.0
   https://github.com/libdriver/w25qxx.git
   https://github.com/stm32duino/LPS22HH.git
   https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library.git
   

